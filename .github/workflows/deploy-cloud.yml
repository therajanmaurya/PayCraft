name: Deploy paycraft.mobilebytesensei.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual deploy)'
        type: boolean
        default: false

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  # Schema FIRST — apply any pending migrations to the prod DB BEFORE the dashboard
  # / edge functions deploy, so new code never lands against an un-migrated schema
  # (a new column/RPC the dashboard reads would otherwise 500 until someone runs
  # `supabase db push` by hand). db push is idempotent — it only applies migrations
  # not already in supabase_migrations.schema_migrations — and our migrations are
  # IF-NOT-EXISTS guarded, so a re-run is a no-op.
  #
  # Requires repo secret SUPABASE_DB_PASSWORD (the prod Postgres password) in
  # addition to the SUPABASE_ACCESS_TOKEN + SUPABASE_PROD_REF the functions job uses.
  deploy-migrations:
    name: Apply Supabase DB migrations
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to production
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROD_REF }}"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-dashboard:
    name: Deploy Next.js dashboard to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [deploy-migrations]
    if: github.event.inputs.dry_run != 'true'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The dashboard is a STANDALONE Next.js app under dashboard/ (no root
      # workspace). Migrated off Vercel → Cloudflare Workers via
      # @opennextjs/cloudflare (2026-08-23): full Next 14 App Router with
      # nodejs_compat, so the Node stripe/razorpay/@supabase SDKs run unchanged.
      # cf:deploy = `opennextjs-cloudflare build && … deploy` (reads
      # CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN below).
      - name: Install deps
        run: npm install

      - name: Build + deploy to Cloudflare Workers
        run: npm run cf:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The org token materializes as CLOUDFLARE_PAGES_API_TOKEN (alias
          # mbs-cloudflare-pages-api-token); wrangler reads CLOUDFLARE_API_TOKEN.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}

  deploy-functions:
    name: Deploy Supabase edge functions
    runs-on: ubuntu-latest
    needs: [deploy-migrations]
    if: github.event.inputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy core functions
        run: |
          supabase functions deploy v2-config \
            --project-ref ${{ secrets.SUPABASE_PROD_REF }}
          supabase functions deploy v2-billing \
            --project-ref ${{ secrets.SUPABASE_PROD_REF }}
          supabase functions deploy stripe-connect-oauth \
            --project-ref ${{ secrets.SUPABASE_PROD_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy webhook handlers
        run: |
          for fn in stripe razorpay paddle paypal lemon-squeezy flutterwave paystack midtrans btcpay; do
            supabase functions deploy "${fn}-webhook" \
              --project-ref ${{ secrets.SUPABASE_PROD_REF }}
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  smoke:
    name: Run production smoke tests
    needs: [deploy-dashboard, deploy-functions]
    uses: ./.github/workflows/cloud-smoke.yml
    secrets: inherit
