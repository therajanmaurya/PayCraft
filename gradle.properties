#Gradle
org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M -XX:MaxMetaspaceSize=768M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Compose Experimental targets
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Publishing
paycraft.version=2.3.2
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true

# AGP 9 + :sample-app (an android APPLICATION that is also a KMP module).
#
# Since AGP 9.0 the 'com.android.application' plugin refuses to coexist with
# 'org.jetbrains.kotlin.multiplatform'. :cmp-paycraft is unaffected — it already uses
# 'com.android.kotlin.multiplatform.library'. Only the sample app hits this, and there is no
# 'com.android.kotlin.multiplatform.application' equivalent to move it to.
#
# These are AGP's own documented escape hatch for exactly this case. They keep the pre-AGP-9
# Kotlin integration + DSL, which is what the build already expects.
#
# Proper fix (follow-up): make :sample-app a plain Android app depending on the published
# cmp-paycraft artifact, instead of a KMP module. Then these two lines come out.
android.builtInKotlin=false
android.newDsl=false
