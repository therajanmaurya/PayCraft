    verdict: pending-device-verify
    reason: "SDK not published; no Android device or emulator available (adb unavailable)"
    capture_path: null
  - consumer: steady
    pinned_version: "2.3.1"
    platform: ios
    bumped: false
    verified: false
    verdict: pending-device-verify
    reason: "SDK not published; no booted iOS simulator or device. Also blocks AC-13 storefront capture."
    capture_path: null

  - consumer: cappy
