[versions]
# AGP 9.2.1 + Gradle 9.5.1 — aligned with mbs/kmp-toolkit, which already runs this toolchain in
# production. Compose MP 1.12 / androidx.compose 1.12 / lifecycle 2.11 all gate on AGP 9.1+.
agp = "9.2.1"
kotlin = "2.4.0"
# 1.11.1 — the version kmp-toolkit ships. NOT 1.12.x: that pulls androidx.compose 1.12, which
# also demands compileSdk 37; kmp-toolkit stays on the 1.11 line at compileSdk 36.
compose-multiplatform = "1.11.1"
android-minSdk = "24"
# compileSdk/targetSdk 36 — matches mbs/kmp-toolkit. Required by androidx activity 1.12+ (its AAR
# metadata refuses compileSdk < 36).
android-compileSdk = "36"
android-targetSdk = "36"
vanniktechMavenPublish = "0.36.0"

# Code Quality
detekt = "1.23.8"
spotless = "7.0.4"
ktlint = "1.5.0"

# Testing
junit = "4.13.2"
coroutines = "1.11.0"

# AndroidX
androidx-activityCompose = "1.12.2"

# PayCraft dependencies
#
# supabase 3.8.0 (was 3.1.4) — THE FIX for the iOS test-link failure. 3.1.4's klibs were compiled
# against kotlinx-datetime 0.6.2, where `kotlinx.datetime.Instant` is a CLASS. Compose MP drags in
# datetime 0.7.1+, where it is a TYPEALIAS to kotlin.time.Instant. Gradle upgraded the artifact but
# the klib's baked-in IR signatures still expected the class, so linkDebugTestIosSimulatorArm64 died
# with `IrTypeAliasSymbolImpl is already bound. Signature: kotlinx.datetime/Instant`. No amount of
# version-forcing fixes that — Supabase had to be rebuilt against 0.7.x+. 3.8.0 targets datetime
# 0.8.0. Do NOT downgrade supabase below 3.8.0 while Compose MP pulls datetime >= 0.7.
#
# ktor 3.5.2 + kotlinxSerialization 1.11.0 are aligned to what supabase 3.8.0 itself depends on
# (3.5.1 / 1.11.0) so the resolved graph has no silent up/down-grades.
# HELD at 3.1.4 — the version published 2.3.1 ships and every consumer resolves against today.
# Moving to 3.8.0 inverted Gradle's resolution: PayCraft's version became HIGHER than the consumers'
# pins, so transitively-shared Supabase modules jumped forward while each consumer's directly-pinned
# artifacts stayed behind. Verified on device: three successive launch crashes, the last of which
# (SelectRequestBuilder.<init>) is an API break requiring a source migration in the consumer, not a
# version bump. Raising this again needs all three consumers migrated in the same release train.
supabase = "3.1.4"
ktor = "3.5.2"
koin = "4.2.2"
kotlinxSerialization = "1.11.0"
# Pinned EXPLICITLY (as kmp-toolkit does) so the Instant-typealias klib clash can never silently
# reappear via a transitive downgrade. See the supabase note above.
kotlinxDatetime = "0.8.0"
multiplatformSettings = "1.3.0"
# 2.9.6 — kmp-toolkit stays here even on AGP 9; lifecycle 2.11 demands compileSdk 37.
lifecycle = "2.9.6"
# Store5 read-through cache (offline-correct entitlement gating — D8). SQLDelight is the
# SourceOfTruth schema-of-record (cmp-paycraft/.../db/Entitlement.sq); its driver + code-gen
# are wired with the native clients in Phase 3 (see build.gradle.kts note).
# HELD at alpha10 (was alpha11) — same reason as the supabase hold above, and proven on device.
# alpha11 bumped its kermit requirement 2.0.5 -> 2.1.0. PayCraft itself no longer uses kermit at all
# (removed this session in favour of PlatformLog), but it still depends on Store5, so alpha11 made
# PayCraft the ONLY requester of kermit 2.1.0 in a consumer's graph — every other requester asks for
# 2.0.x — and Gradle's highest-wins then forced 2.1.0 on consumers compiled against 2.0.8. That is
# DR-4 crash #2: reels-downloader died at launch in its OWN AppOpenAdManager with
# NoSuchMethodError Logger$Companion.d$default. Removing PayCraft's DIRECT kermit dependency did not
# fix it; the transitive Store5 path is what mattered. alpha10 requires kermit 2.0.5, so consumers
# resolve to their own pin and nothing is forced upward.
# Do NOT raise to alpha11+ without first checking its kermit requirement against every consumer pin
# (reels 2.0.8; steady + cappy 2.1.0 and therefore unaffected either way).
store5 = "5.1.0-alpha10"
sqldelight = "2.3.2"
# Google Play Billing Library v9 — native Android IAP client (Phase 3, D8/D13). billing-ktx
# bundles the suspend query extensions used by PlayBillingNativeClient.
#
# 9.x dropped the legacy SKU-era surface: SkuDetails, SkuDetailsParams, SkuDetailsResponseListener,
# BillingClient.SkuType and QueryPurchaseHistoryParams are GONE (not merely deprecated). This SDK
# was already fully on the ProductDetails API, so the 8.3.0→9.1.0 move required no code change —
# every class it touches (BillingClient, Purchase, PendingPurchasesParams,
# SubscriptionProductReplacementParams) is signature-identical across the two, and BillingClient
# only GAINED methods (getBillingChoiceInfoAsync / showBillingProgramInformationDialog, the EU-DMA
# alternative-billing surface we do not opt into).
#
# minSdk 23 required by the AAR; this project is on 24. Do NOT reintroduce SkuDetails-era calls.
google-billing = "9.1.0"
# Roborazzi — device-free Compose Desktop (Skiko) golden render for AC-15 (03-shimmer-productlist).
# jvmTest ONLY (never commonTest — Skiko-desktop artifact leaks would break js/wasm/ios compile).
# 1.67.0 is the proven baseline (memory: roborazzi-desktop-render-tier-recipe, 2026-08-06).
roborazzi = "1.73.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
junit = { module = "junit:junit", version.ref = "junit" }

# Detekt
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }

# Supabase
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "supabase" }
supabase-auth      = { module = "io.github.jan-tennert.supabase:auth-kt",      version.ref = "supabase" }
supabase-realtime  = { module = "io.github.jan-tennert.supabase:realtime-kt",  version.ref = "supabase" }

# Ktor (required by Supabase)
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }

# Compose Testing (version aligned with CMP 1.7.3 → AndroidX Compose 1.7.6)
# Held at 1.7.6 with compose-multiplatform — 1.12.0 requires AGP 9.1.0+.
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version = "1.7.6" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version = "1.7.6" }

# Lifecycle (KMP ViewModel + collectAsStateWithLifecycle)
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Logging

# Settings (email persistence + offline entitlement SoT)
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }

# Store5 read-through cache (D8 — offline-correct entitlement gating)
store5 = { module = "org.mobilenativefoundation.store:store5", version.ref = "store5" }
# SQLDelight coroutines-extensions — consumed by the SQLDelight-backed EntitlementDao once its
# driver + code-gen are wired (Phase 3 / platform layer); schema-of-record: Entitlement.sq.
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# Google Play Billing v9 (androidMain) — connect / queryProductDetails / launchBillingFlow /
# queryPurchasesAsync / acknowledge. -ktx bundles the suspend query extensions used by
# PlayBillingNativeClient (billing/NativeBillingClient.android.kt).
google-billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "google-billing" }

# Roborazzi Compose Desktop (Skiko) — device-free golden-render capture for AC-15. jvmTest ONLY.
# `roborazzi-compose-desktop` carries captureRoboImage(SemanticsNodeInteraction, filePath, ...)
# in package io.github.takahirom.roborazzi (RoborazziDesktopKt). The plain `roborazzi` AAR is
# Android-only (no JVM variant); scanner-support is Android-only (we author explicit capture tests
# so no scanner needed).
roborazzi-compose-desktop = { module = "io.github.takahirom.roborazzi:roborazzi-compose-desktop", version.ref = "roborazzi" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# Roborazzi Gradle plugin — generates record/verify tasks per target when applied to the module.
# Applied to :cmp-paycraft only (jvm target consumes it via jvmTest deps); do not apply at root.
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
