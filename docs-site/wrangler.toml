name = "paycraft-docs"
compatibility_date = "2026-06-17"

# Cloudflare Workers Static Assets. The docs site is a pure static Docusaurus
# build (no Worker code) served as assets. Cloudflare migrated this project to
# Workers Builds, whose deploy step runs `wrangler versions upload` (a Workers
# command). That command needs a Worker entry-point OR an assets directory —
# the old `pages_build_output_dir = "build"` is a Pages-only field it IGNORES,
# which produced: "Missing entry-point to Worker script or to assets directory".
# Pointing `[assets].directory` at the Docusaurus output makes the upload deploy
# the static site with no Worker script.
[assets]
directory = "./build"
not_found_handling = "404-page"
